
name: RaceDay Part 3 Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Find solution and project files
        run: |
          echo "Repository location:"
          pwd
          echo "Files and folders:"
          find . -maxdepth 5 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) -print

      - name: Locate solution
        run: |
          SOLUTION=$(find . -name 'RaceDay.Part2.sln' -print -quit)

          if [ -z "$SOLUTION" ]; then
            echo "Solution file not found."
            exit 1
          fi

          echo "SOLUTION=$SOLUTION" >> "$GITHUB_ENV"

      - name: Restore solution dependencies
        run: dotnet restore "$SOLUTION"

      - name: Build solution
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test "$SOLUTION" --configuration Release --no-build --verbosity normal

      - name: Locate MVC project
        run: |
          MVC_PROJECT=$(find . -name 'MVC.csproj' -print -quit)

          if [ -z "$MVC_PROJECT" ]; then
            echo "MVC project file not found."
            exit 1
          fi

          echo "MVC_PROJECT=$MVC_PROJECT" >> "$GITHUB_ENV"

      - name: Restore MVC dependencies
        run: dotnet restore "$MVC_PROJECT"

      - name: Build MVC project
        run: dotnet build "$MVC_PROJECT" --configuration Release --no-restore
