name: RaceDay Part 2 Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Find solution and project files
        run: |
          echo "Repository location:"
          pwd
          echo "Files and folders:"
          find . -maxdepth 5 \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \) -print

      - name: Restore dependencies
        run: dotnet restore "$(find . -name 'RaceDay.Part2.sln' -print -quit)"

      - name: Build solution
        run: dotnet build "$(find . -name 'RaceDay.Part2.sln' -print -quit)" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$(find . -name 'RaceDay.Part2.sln' -print -quit)" --configuration Release --no-build --verbosity normal